    <path d="M 94,26 A 52,52 0 1,0 94,104" fill="none" stroke="#3B3388" stroke-width="11" stroke-linecap="round" />
    
    <!-- Inner Vivid Lime Green C-Ring -->
    <path d="M 84,36 A 40,40 0 1,0 84,94" fill="none" stroke="#6CB42C" stroke-width="9" stroke-linecap="round" />
    
    <!-- Dark Green "V" Left Branch -->
