    <path d="M 80,55 C 84,47 91,50 89,56 C 85,60 80,58 80,55 Z" fill="#FAA61A" />
    <path d="M 87,51 C 84,42 92,39 97,44 C 98,49 92,53 87,51 Z" fill="#FAA61A" />
    <path d="M 93,46 C 98,38 105,41 103,47 C 99,51 94,49 93,46 Z" fill="#FAA61A" />
    <path d="M 100,42 C 97,33 106,31 110,36 C 111,41 105,44 100,42 Z" fill="#FAA61A" />
    <path d="M 114,34 C 114,26 124,27 125,33 C 124,38 117,39 114,34 Z" fill="#FAA61A" />
