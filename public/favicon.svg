    <path d="M 59,40 C 65,37 68,41 65,45 C 61,47 59,44 59,44 Z" fill="#00A859" />
    <path d="M 59,48 C 52,45 49,50 52,54 C 57,56 59,52 59,52 Z" fill="#00A859" />
    <path d="M 59,48 C 66,45 69,50 66,54 C 61,56 59,52 59,52 Z" fill="#00A859" />
    <path d="M 59,56 C 51,53 48,59 51,63 C 56,65 59,61 59,61 Z" fill="#00A859" />
    <path d="M 59,56 C 67,53 70,59 67,63 C 62,65 59,61 59,61 Z" fill="#00A859" />
    
